[project]
name = "tourist-assistant"
version = "0.1.0"
description = "Asistente turístico de Tenerife: RAG + diálogo multiturno + function calling con LangGraph"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2",
    "langchain>=0.3",
    "langchain-ollama",
    "langchain-chroma",
    "chromadb",
    "pymupdf",
    "pydantic>=2",
    "pydantic-settings",
    "httpx",
    "python-dotenv",
    "tiktoken",
]

[project.optional-dependencies]
api = ["langchain-openai", "langchain-google-genai"]
ui = ["gradio"]
dev = ["pytest", "ruff", "jupyter", "ipykernel", "matplotlib", "pandas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tourist_assistant"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
